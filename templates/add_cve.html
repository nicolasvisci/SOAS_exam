<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi nuova CVE</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .top-right {
            position: absolute;
            top: 10px;
            right: 20px;
            font-weight: bold;
            color: #333;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
            text-align: left;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        textarea {
            resize: vertical;
        }

        .btn-container {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 12px;
            margin: 5px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn[type="submit"] {
            background-color: #28a745;
        }

        .btn[type="submit"]:hover {
            background-color: #218838;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

    <div class="top-right">
        {% if user %}
            <span>Benvenuto, {{ user }}</span>
        {% endif %}
    </div>

    <h1>Aggiungi una nuova CVE</h1>
    <form action="/add_cve" method="post">

        <label for="cve_id">CVE ID (Generato automaticamente)</label>
        <label for="description">Descrizione della CVE:</label>
        <textarea id="description" name="description" rows="4" required></textarea><br><br>

        <div class="btn-container">
            <button type="submit" class="btn">Aggiungi CVE</button>
            <a href="/" class="btn">Home</a>
            <a href="/logout" class="btn">Logout</a>
        </div>
    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script type="text/javascript">
                alert("{{ messages[0] }}");
            </script>
        {% endif %}
    {% endwith %}


</body>
</html>
