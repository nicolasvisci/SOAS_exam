<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add CVE</title>
</head>
<body>
    <h1>Add a New CVE</h1>
    <form action="/add_cve" method="post">
        <label for="cve_id">CVE ID:</label>
        <input type="text" id="cve_id" name="cve_id" required><br><br>

        <label for="source_identifier">Source Identifier (Email):</label>
        <input type="email" id="source_identifier" name="source_identifier" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" required></textarea><br><br>

        <button type="submit">Add CVE</button>
    </form>
</body>
</html>
